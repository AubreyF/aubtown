services:
  restate:
    image: docker.restate.dev/restatedev/restate:1.7.3
    command: ["--node-name=freedworks-restate-1"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9070:9070"
    volumes:
      - restate-data:/restate-data

  control-plane:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      - PORT=9080
      - FREEDWORKS_HOST_ENROLLMENTS_JSON
      - FREEDWORKS_ACCOUNT_PROFILES_JSON
      - FREEDWORKS_ENABLE_INTEGRATION_HARNESS=true
    restart: unless-stopped
    depends_on:
      - restate

  host-edge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["node", "dist/edge-gateway.js"]
    environment:
      - PORT=8090
      - FREEDWORKS_RESTATE_INGRESS=http://restate:8080
    restart: unless-stopped
    depends_on:
      - restate
    ports:
      - "127.0.0.1:8090:8090"

  checkpoint-data-init:
    profiles: ["checkpoint-transfer"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    user: "0:0"
    command: ["sh", "-c", "chown 1000:1000 /checkpoint-data && chmod 700 /checkpoint-data"]
    restart: "no"
    volumes:
      - checkpoint-data:/checkpoint-data

  checkpoint-edge:
    profiles: ["checkpoint-transfer"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["node", "dist/checkpoint-edge.js"]
    environment:
      - PORT=8091
      - FREEDWORKS_CHECKPOINT_STORE_ROOT=/checkpoint-data
    restart: unless-stopped
    depends_on:
      checkpoint-data-init:
        condition: service_completed_successfully
    volumes:
      - checkpoint-data:/checkpoint-data
    ports:
      - "127.0.0.1:8091:8091"

volumes:
  restate-data:
  checkpoint-data:
