services:
  restate:
    environment:
      - RESTATE_WORKER__INVOKER__REQUEST_IDENTITY_PRIVATE_KEY_PEM_FILE=/run/aubtown/restate-identity.pem
    volumes:
      - "${AUBTOWN_RESTATE_IDENTITY_KEY_FILE:?set the absolute Restate identity key path}:/run/aubtown/restate-identity.pem:ro"

  control-secrets-init:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    user: "0:0"
    command:
      - sh
      - -c
      - install -o 1000 -g 1000 -m 0400 /source/checkpoint-grant-private.pem /destination/checkpoint-grant-private.pem
    restart: "no"
    volumes:
      - "${AUBTOWN_CHECKPOINT_GRANT_PRIVATE_KEY_FILE:?set the absolute checkpoint grant key path}:/source/checkpoint-grant-private.pem:ro"
      - control-secrets:/destination

  control-plane:
    environment:
      - AUBTOWN_ENABLE_INTEGRATION_HARNESS=false
      - AUBTOWN_CHECKPOINT_GRANT_PRIVATE_KEY_FILE=/run/aubtown-secrets/checkpoint-grant-private.pem
      - AUBTOWN_CHECKPOINT_RECEIPT_PUBLIC_KEY_FILE=/run/aubtown/checkpoint-receipt-public.pem
      - AUBTOWN_HOST_ENROLLMENTS_FILE=/run/aubtown/host-enrollments.json
      - AUBTOWN_ACCOUNT_PROFILES_FILE=/run/aubtown/account-profiles.json
      - AUBTOWN_RESTATE_IDENTITY_KEYS
      - AUBTOWN_HOST_ENROLLMENTS_JSON
    volumes:
      - "${AUBTOWN_HOST_ENROLLMENTS_FILE:?set the absolute host enrollment file path}:/run/aubtown/host-enrollments.json:ro"
      - "${AUBTOWN_ACCOUNT_PROFILES_FILE:?set the absolute account profiles file path}:/run/aubtown/account-profiles.json:ro"
      - "${AUBTOWN_CHECKPOINT_RECEIPT_PUBLIC_KEY_FILE:?set the absolute checkpoint receipt public key path}:/run/aubtown/checkpoint-receipt-public.pem:ro"
      - control-secrets:/run/aubtown-secrets:ro
    depends_on:
      control-secrets-init:
        condition: service_completed_successfully

  checkpoint-edge-secrets-init:
    profiles: ["checkpoint-transfer"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    user: "0:0"
    command:
      - sh
      - -c
      - install -o 1000 -g 1000 -m 0400 /source/checkpoint-receipt-private.pem /destination/checkpoint-receipt-private.pem
    restart: "no"
    volumes:
      - "${AUBTOWN_CHECKPOINT_RECEIPT_PRIVATE_KEY_FILE:?set the absolute checkpoint receipt private key path}:/source/checkpoint-receipt-private.pem:ro"
      - checkpoint-edge-secrets:/destination

  checkpoint-edge:
    environment:
      - AUBTOWN_HOST_ENROLLMENTS_FILE=/run/aubtown/host-enrollments.json
      - AUBTOWN_CHECKPOINT_GRANT_PUBLIC_KEY_FILE=/run/aubtown/checkpoint-grant-public.pem
      - AUBTOWN_CHECKPOINT_RECEIPT_PRIVATE_KEY_FILE=/run/aubtown-secrets/checkpoint-receipt-private.pem
    volumes:
      - "${AUBTOWN_HOST_ENROLLMENTS_FILE:?set the absolute host enrollment file path}:/run/aubtown/host-enrollments.json:ro"
      - "${AUBTOWN_CHECKPOINT_GRANT_PUBLIC_KEY_FILE:?set the absolute checkpoint grant public key path}:/run/aubtown/checkpoint-grant-public.pem:ro"
      - checkpoint-edge-secrets:/run/aubtown-secrets:ro
    depends_on:
      checkpoint-edge-secrets-init:
        condition: service_completed_successfully

volumes:
  control-secrets:
  checkpoint-edge-secrets:
