services:
  restate:
    environment:
      - RESTATE_REQUEST_IDENTITY_PRIVATE_KEY_PEM_FILE=/run/freedworks/restate-identity.pem
    volumes:
      - "${FREEDWORKS_RESTATE_IDENTITY_KEY_FILE:?set the absolute Restate identity key path}:/run/freedworks/restate-identity.pem:ro"

  control-secrets-init:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    user: "0:0"
    command:
      - sh
      - -c
      - install -o 1000 -g 1000 -m 0400 /source/checkpoint-grant-private.pem /destination/checkpoint-grant-private.pem
    restart: "no"
    volumes:
      - "${FREEDWORKS_CHECKPOINT_GRANT_PRIVATE_KEY_FILE:?set the absolute checkpoint grant key path}:/source/checkpoint-grant-private.pem:ro"
      - control-secrets:/destination

  control-plane:
    environment:
      - FREEDWORKS_ENABLE_INTEGRATION_HARNESS=false
      - FREEDWORKS_CHECKPOINT_GRANT_PRIVATE_KEY_FILE=/run/freedworks-secrets/checkpoint-grant-private.pem
      - FREEDWORKS_HOST_ENROLLMENTS_FILE=/run/freedworks/host-enrollments.json
      - FREEDWORKS_RESTATE_IDENTITY_KEYS
      - FREEDWORKS_HOST_ENROLLMENTS_JSON
    volumes:
      - "${FREEDWORKS_HOST_ENROLLMENTS_FILE:?set the absolute host enrollment file path}:/run/freedworks/host-enrollments.json:ro"
      - control-secrets:/run/freedworks-secrets:ro
    depends_on:
      control-secrets-init:
        condition: service_completed_successfully

  checkpoint-edge:
    environment:
      - FREEDWORKS_HOST_ENROLLMENTS_FILE=/run/freedworks/host-enrollments.json
      - FREEDWORKS_CHECKPOINT_GRANT_PUBLIC_KEY_FILE=/run/freedworks/checkpoint-grant-public.pem
    volumes:
      - "${FREEDWORKS_HOST_ENROLLMENTS_FILE:?set the absolute host enrollment file path}:/run/freedworks/host-enrollments.json:ro"
      - "${FREEDWORKS_CHECKPOINT_GRANT_PUBLIC_KEY_FILE:?set the absolute checkpoint grant public key path}:/run/freedworks/checkpoint-grant-public.pem:ro"

volumes:
  control-secrets:
