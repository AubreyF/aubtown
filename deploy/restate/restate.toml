cluster-name = "aubtown-pilot"
node-name = "aubtown-restate-1"
base-dir = "/var/lib/aubtown/restate"
auto-provision = true
listen-mode = "tcp"
bind-address = "127.0.0.1:5122"
advertised-address = "http://127.0.0.1:5122/"
log-format = "json"
log-disable-ansi-codes = true

[admin]
bind-address = "127.0.0.1:9070"
advertised-address = "http://127.0.0.1:9070/"
disable-web-ui = true

[ingress]
bind-address = "127.0.0.1:8080"
advertised-address = "http://127.0.0.1:8080/"
