services:
  control-plane:
    environment:
      - AUBTOWN_CHECKPOINT_GRANT_PRIVATE_KEY_FILE=/run/aubtown/checkpoint-grant-private.pem
      - AUBTOWN_CHECKPOINT_RECEIPT_PUBLIC_KEY_FILE=/run/aubtown/checkpoint-receipt-public.pem
    volumes:
      - "${AUBTOWN_TEST_CHECKPOINT_GRANT_KEY_FILE:?set the integration grant key path}:/run/aubtown/checkpoint-grant-private.pem:ro"
      - "${AUBTOWN_TEST_CHECKPOINT_RECEIPT_PUBLIC_KEY_FILE:?set the integration receipt public key path}:/run/aubtown/checkpoint-receipt-public.pem:ro"

  checkpoint-edge:
    environment:
      - AUBTOWN_HOST_ENROLLMENTS_JSON
      - AUBTOWN_CHECKPOINT_GRANT_PUBLIC_KEY_FILE=/run/aubtown/checkpoint-grant-public.pem
      - AUBTOWN_CHECKPOINT_RECEIPT_PRIVATE_KEY_FILE=/run/aubtown/checkpoint-receipt-private.pem
    volumes:
      - "${AUBTOWN_TEST_CHECKPOINT_GRANT_PUBLIC_KEY_FILE:?set the integration grant public key path}:/run/aubtown/checkpoint-grant-public.pem:ro"
      - "${AUBTOWN_TEST_CHECKPOINT_RECEIPT_PRIVATE_KEY_FILE:?set the integration receipt key path}:/run/aubtown/checkpoint-receipt-private.pem:ro"
